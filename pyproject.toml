[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "julia-persona-extractor"
version = "0.1.0"
description = "Evidence-backed persona continuity extraction and Persona Package generation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Julia Persona Ecosystem Contributors" }]
keywords = ["persona", "evidence", "causal-experience", "continuity", "archive-normalization"]
dependencies = ["jsonschema>=4.22.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.5.0", "jcs==0.2.1"]

[project.scripts]
persona-extractor = "persona_extractor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
